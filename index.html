<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, follow">
    <title>Woody TV</title>
    <meta name="application-name" content="Woody">
    <meta name="apple-mobile-web-app-title" content="Woody">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0b0e11">
    <link rel="icon" href="./woody-32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="./woody-16.png" type="image/png" sizes="16x16">
    <link rel="shortcut icon" href="./favicon.ico">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180">
    <link rel="manifest" href="./manifest.webmanifest">
    <style>
      :root { color-scheme: dark; }
      html, body, main { width: 100%; height: 100%; }
      body { margin: 0; overflow: hidden; background: #151511; }
      iframe { display: block; width: 100%; height: 100%; border: 0; }
    </style>
  </head>
  <body>
    <main>
      <!-- Para mudar de alojamento, alterar apenas o endereço no atributo src. -->
      <iframe
        id="woody-app"
        title="Woody TV — televisão em direto"
        src="https://woody-tv-jtaps.alwaysdata.net/"
        allow="fullscreen; autoplay; encrypted-media; picture-in-picture; screen-wake-lock; storage-access"
        allowfullscreen
      ></iframe>
    </main>
    <script>
      (() => {
        const frame = document.getElementById('woody-app');
        const destination = new URL(frame.src);
        const paths = new Set(['/', '/watch.html', '/users.html', '/sala.html', '/filmes.html', '/programas.html', '/resumos.html', '/login.html', '/device-limit.html']);
        const query = new URLSearchParams(window.location.search);
        const route = query.getAll('woody-path');
        query.delete('woody-path');
        if (route.length === 1 && paths.has(route[0])) destination.pathname = route[0];
        destination.search = query.toString();
        destination.hash = window.location.hash;
        window.addEventListener('message', event => {
          if (event.source !== frame.contentWindow || event.origin !== destination.origin) return;
          if (event.data?.app !== 'woody-mask-v1' || event.data.type !== 'context-request') return;
          const mask = new URL(window.location.href);
          mask.search = ''; mask.hash = '';
          frame.contentWindow.postMessage({app: 'woody-mask-v1', type: 'context', url: mask.href}, destination.origin);
        });
        if (frame.src !== destination.href) frame.src = destination.href;
      })();
    </script>
  </body>
</html>
