<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, follow">
    <title>Woody TV</title>
    <meta name="application-name" content="Woody">
    <meta name="apple-mobile-web-app-title" content="Woody">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0b0e11">
    <link rel="icon" href="./woody-32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="./woody-16.png" type="image/png" sizes="16x16">
    <link rel="shortcut icon" href="./favicon.ico">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180">
    <link rel="manifest" href="./manifest.webmanifest">
    <style>
      :root { color-scheme: dark; }
      html, body, main { width: 100%; height: 100%; }
      body { margin: 0; overflow: hidden; background: #151511; }
      iframe { display: block; width: 100%; height: 100%; border: 0; }
    </style>
  </head>
  <body>
    <main>
      <!-- Para mudar de alojamento, alterar apenas o endereço no atributo src. -->
      <iframe
        id="woody-app"
        title="Woody TV — televisão em direto"
        src="https://woody-tv-jtaps.alwaysdata.net/"
        allow="fullscreen; autoplay; encrypted-media; picture-in-picture; screen-wake-lock"
        allowfullscreen
      ></iframe>
    </main>
    <script>
      (() => {
        const frame = document.getElementById('woody-app');
        const destination = new URL(frame.src);
        destination.search = window.location.search;
        destination.hash = window.location.hash;
        if (frame.src !== destination.href) frame.src = destination.href;
      })();
    </script>
  </body>
</html>
